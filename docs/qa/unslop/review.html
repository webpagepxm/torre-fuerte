<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Torre Fuerte OPS · Antes y después</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #f5f5f3;
        color: #24282d;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1500px;
        margin: auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 500;
      }
      p {
        color: #596168;
        max-width: 800px;
      }
      label {
        display: grid;
        gap: 8px;
        max-width: 440px;
        margin-block: 24px;
      }
      select {
        min-height: 48px;
        padding: 12px;
        font: inherit;
        border: 1px solid #b9bec2;
        border-radius: 8px;
        background: white;
      }
      .comparison {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
        align-items: start;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      figcaption {
        margin-bottom: 12px;
        font-weight: 500;
      }
      figure a {
        display: block;
        max-height: 900px;
        overflow: auto;
        border: 1px solid #dedfdf;
        background: white;
        border-radius: 8px;
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: auto;
      }
      :focus-visible {
        outline: 3px solid #c5272e;
        outline-offset: 4px;
      }
      @media (max-width: 700px) {
        body {
          padding: 16px;
        }
        .comparison {
          gap: 12px;
        }
        figcaption {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Torre Fuerte OPS · Antes y después</h1>
      <p>
        Capturas reales del navegador con expedientes ficticios. Elige una
        pantalla y pulsa una imagen para verla a tamaño completo. Para trabajar
        con las órdenes, abre el
        <a href="../../../operacion/">portal del taller</a>.
      </p>
      <label
        >Pantalla
        <select id="screen">
          <option value="orders-390">Órdenes · móvil de 390 px</option>
          <option value="orders-320">Órdenes · móvil de 320 px</option>
          <option value="orders-768">Órdenes · tablet de 768 px</option>
          <option value="orders-1440">Órdenes · escritorio de 1440 px</option>
          <option value="detail-390">Detalle de orden · 390 px</option>
          <option value="documents-390">Documentos · 390 px</option>
          <option value="calendar-390">Calendario · 390 px</option>
          <option value="login-320">Acceso · 320 px</option>
        </select>
      </label>
      <div class="comparison">
        <figure>
          <figcaption>Antes · checkpoint a9e326f</figcaption>
          <a id="beforeLink" href="before/orders-390.png"
            ><img
              id="before"
              src="before/orders-390.png"
              alt="Órdenes de prueba, antes de la intervención"
          /></a>
        </figure>
        <figure>
          <figcaption>Después · revisión Unslop</figcaption>
          <a id="afterLink" href="after/orders-390.png"
            ><img
              id="after"
              src="after/orders-390.png"
              alt="Órdenes de prueba, después de la intervención"
          /></a>
        </figure>
      </div>
      <p>
        <a href="../../torre-fuerte-ops-audit.md"
          >Leer auditoría, pruebas y límites</a
        >
        ·
        <a href="after/note-example-390.png">Ver nota con concepto de prueba</a>
      </p>
    </main>
    <script>
      document.getElementById("screen").addEventListener("change", (event) => {
        for (const phase of ["before", "after"]) {
          const source = phase + "/" + event.target.value + ".png";
          document.getElementById(phase).src = source;
          document.getElementById(phase).alt =
            event.target.selectedOptions[0].textContent +
            " · " +
            (phase === "before" ? "antes" : "después") +
            " · datos ficticios";
          document.getElementById(phase + "Link").href = source;
        }
      });
    </script>
  </body>
</html>
