name: Android install card
on:
  push:
    branches:
      - feat/android-install-login-card-20261111
  pull_request:
    branches: [main]
jobs:
  android-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar PWA y módulo de instalación Android
        run: node --test tests/pwa.test.cjs tests/android-install.test.cjs
