  async function syncDirectorPlan(){
    if(!/^https?:$/.test(location.protocol))return;
    try{
      const r=await fetch(new URL('studio-plan.json',document.baseURI).href+'?fresh='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw new Error('No hay plan remoto');
      const incoming=await r.json();
      if(!directorValid(incoming))throw new Error('Formato no válido');
      const changed=JSON.stringify(data.director)!==JSON.stringify(incoming);
      directorSyncState='live';directorLastChecked=new Date();
      if(changed){data.director=incoming;save();if(page==='direccion')render()}
      else if(page==='direccion')render();
    }catch(e){
      directorSyncState='local';
      if(page==='direccion')render();
    }
  }

 id="copyUtm">${icon('copy')} Copiar enlace</button></div></div></div></div>`;const update=()=>{try{const url=new URL(document.getElementById('utmUrl').value);if(!['https:','http:'].includes(url.protocol))throw Error();url.searchParams.set('utm_source',document.getElementById('utmSource').value);url.searchParams.set('utm_medium',document.getElementById('utmMedium').value.trim());url.searchParams.set('utm_campaign',document.getElementById('utmCampaign').value.trim());document.getElementById('utmOutput').value=url.toString()}catch{document.getElementById('utmOutput').value='Introduce una URL https:// válida'}};['utmUrl','utmSource','utmMedium','utmCampaign'].forEach(i=>document.getElementById(i).addEventListener('input',update));update();document.getElementById('copyUtm').onclick=async()=>{const value=document.getElementById('utmOutput').value;if(!value.startsWith('http'))return toast('Primero introduce una URL válida');try{await navigator.clipboard.writeText(value);toast('Enlace copiado')}catch{document.getElementById('utmOutput').select();document.execCommand('copy');toast('Enlace listo para copiar')}};

  function openMetrics(p){const m=p.performance||{};modalRoot.innerHTML=`<div class="modal-backdrop" data-action="closeModalOutside"><div class="modal modal-sm" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>Registrar resultados</h2><p>${esc(p.title)} · Datos manuales, no conexión API</p></div><button class="modal-close" data-action="closeModal">${icon('close')}</button></div><form id="metricsForm"><div class="modal-body"><div class="form-row">${[['reach','Alcance'],['interactions','Interacciones'],['clicks','Clics'],['orders','Pedidos atribuibles']].map(([key,label])=>`<div class="form-group"><label>${label}</label><input name="${key}" class="form-input" type="number" min="0" step="1" value="${Number(m[key]||0)}" /></div>`).join('')}</div><div class="help-detail">Introduce únicamente métricas observadas en la red social o pedidos realmente atribuibles a esta publicación. No estimes resultados como si fueran mediciones.</div></div><div class="modal-footer"><span class="form-hint">Registro manual</span><div class="modal-footer-right"><button type="button" class="btn btn-outline" data-action="closeModal">Cancelar</button><button type="submit" class="btn">Guardar métricas</button></div></div></form></div></div>`;document.getElementById('metricsForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);p.performance=Object.fromEntries(['reach','interactions','clicks','orders'].map(k=>[k,Math.max(0,Number(f.get(k))||0)]));if(save()){closeModal();render();toast('Resultados manuales guardados')}})}

es(c.status)?c.status:'planeada',start:/^\d{4}-\d{2}-\d{2}$/.test(c.start)?c.start:'',end:/^\d{4}-\d{2}-\d{2}$/.test(c.end)?c.end:'',budget:Math.max(0,Number(c.budget)||0)}))};if(save()){render();toast('Respaldo importado')} }catch(err){toast('No se pudo importar: JSON inválido o no compatible')}e.target.value='' });
